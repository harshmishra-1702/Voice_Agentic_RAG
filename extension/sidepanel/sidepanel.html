<!DOCTYPE html>
<html>
<head>
  <title>VoiceOps Companion</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display:flex; align-items:center; gap:8px;">
        <img src="../icons/icon32.png" width="22" height="22" style="border-radius:5px;" alt="Logo">
        <h2 style="margin:0;">VoiceOps Companion</h2>
      </div>
      <div id="status-badge" class="badge">Idle</div>
    </div>
    
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0;">Target Context</h3>
        <button id="refresh-context-btn" style="background:transparent; border:none; color:#60a5fa; cursor:pointer; font-size:0.75em; padding:2px 6px; width:auto; text-decoration:underline;">Re-detect Tab</button>
      </div>
      <div id="context-info">Detecting active page...</div>
      <button id="send-context-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        Transmit to VoiceOps
      </button>
    </div>

    <div class="card telemetry-card">
      <h3>Transmission Log</h3>
      <div id="event-stream" class="event-stream">
        <div class="log-entry sys">Waiting for context transmission...</div>
      </div>
    </div>

    <div class="card">
      <h3>MemoryLab Dashboard</h3>
      <button id="open-ml-btn" class="secondary-btn">Open Local Console</button>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
